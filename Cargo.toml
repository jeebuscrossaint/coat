[package]
name = "coat"
version = "0.1.0"
edition = "2021"
# Ship the completion script inside the published crate/source tarball so
# packagers can install it; `cargo install` won't place it for you.
include = ["src/**/*", "templates/**/*", "completions/**/*", "README.md", "USAGE.md", "LICENSE"]

# cargo-deb: install the fish completions to the system vendor dir.
[package.metadata.deb]
assets = [
    ["target/release/coat", "usr/bin/", "755"],
    ["completions/coat.fish", "usr/share/fish/vendor_completions.d/coat.fish", "644"],
]

[[bin]]
name = "coat"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
# serde_yaml is deprecated; serde_norway is its maintained drop-in fork.
serde_norway = "0.9"
serde_json = "1"
tera = "2"
anyhow = "1"
console = "0.16"
# `coat match` decodes the wallpaper. Explicit format list rather than the
# default features: this covers everything awww/swww will display and leaves out
# avif/exr, which together cost more build time than the rest of coat.
# Wallpaper formats for `coat match`. No tiff: it alone pulled in 21 crates,
# and wallpapers are not tiffs.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "pnm"] }

# Already built for `console`; named here only to restore SIGPIPE (main.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Known-folder lookup. Linux only needs $HOME and the XDG variables (paths.rs).
dirs = "7"
winreg = "0.56"
# Direct Win32 calls for the shell restart, settings broadcast, and UAC
# relaunch — these used to shell out to PowerShell + Add-Type, which cost
# seconds per apply and breaks under constrained language mode.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    # SHELLEXECUTEINFOW carries an HKEY, so it sits behind the registry feature.
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Cargo's default LTO and codegen units: a release rebuild after a one-line
# change takes ~5s instead of ~40s. Fat LTO bought a 13% smaller binary and no
# measurable speed -- an apply is ~4.6ms either way, nearly all of it file IO.
[profile.release]
strip = true
panic = "abort"

# The smallest binary, for packaging: `cargo build --profile dist`.
[profile.dist]
inherits = "release"
lto = true
codegen-units = 1
